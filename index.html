    <script>
      (function() {
        // Suppress unhandled promise rejections from Vite WebSocket in sandbox
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (
            (event.reason.message && event.reason.message.includes('WebSocket')) ||
            (typeof event.reason === 'string' && event.reason.includes('WebSocket')) ||
            (event.reason.toString && event.reason.toString().includes('WebSocket'))
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Suppress benign [vite] websocket connection error in iframe
        const origError = console.error;
        console.error = function(...args) {
          if (typeof args[0] === 'string' && args[0].includes('[vite] failed to connect to websocket')) {
            return;
          }
          if (args[0] && args[0].message && typeof args[0].message === 'string' && args[0].message.includes('WebSocket closed without opened')) {
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
